# Used only for command-line Alembic (e.g. `alembic revision --autogenerate -m "..."` from the backend folder).
# The application itself builds its Alembic config in code (see app/database/database.py).
[alembic]
script_location = app/database/migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally unset: migrations/env.py falls back to the app settings (STEALTHBOT_* env vars).
