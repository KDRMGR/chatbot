[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: needs a running Ollama with the configured models (run with: pytest -m live)
# -p no:cacheprovider keeps .pytest_cache out of the OneDrive-synced project folder
addopts = -m "not live" -q -p no:cacheprovider
