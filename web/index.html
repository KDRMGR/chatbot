<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>StealthBot Online: sign in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="login">
  <header class="top">
    <h1>StealthBot</h1>
  </header>

  <main>
    <!-- ================================================== sign in; the page then sends you to /admin or /streamer by your role -->
    <section class="card narrow" id="view-login">
      <h2>Sign in</h2>
      <form id="form-login">
        <label class="field"><span>Email</span><input type="email" id="login-email" autocomplete="username" required></label>
        <label class="field"><span>Password</span><input type="password" id="login-password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
        <button type="button" class="quiet" id="btn-forgot">Forgot password</button>
      </form>
      <p class="hint" id="login-msg" role="status"></p>
      <p class="hint">Accounts are created by the owner; there is no sign-up. Admins go to the control panel, streamers to the talk screen.</p>
    </section>

    <!-- ================================================== choose a password (invite / recovery link) -->
    <section class="card narrow" id="view-password" hidden>
      <h2>Choose a password</h2>
      <form id="form-password">
        <label class="field"><span>New password</span>
          <input type="password" id="new-password" autocomplete="new-password" required></label>
        <label class="field"><span>Repeat it</span>
          <input type="password" id="new-password2" autocomplete="new-password" required></label>
        <button type="submit">Save password</button>
      </form>
      <p class="hint" id="password-msg" role="status"></p>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
